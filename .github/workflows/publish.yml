name: publish

# Publishes @businessgateway/sdk to npm when a version tag is pushed. The tag
# must match package.json's version, so a release is: bump the version in a
# PR, merge it, then push the tag (git tag v0.1.0 && git push origin v0.1.0).
# The package is published with provenance, which ties it to this workflow
# run and this commit for anyone who installs it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $v"; exit 1; }
      - run: npm ci
      - run: npm run generate && git diff --exit-code -- src/generated
      - run: npm run typecheck
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
