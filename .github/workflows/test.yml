name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Node the package supports, and the current one.
        node: [20, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The generated types must be what spec/openapi.json produces.
      - run: npm run generate && git diff --exit-code -- src/generated
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
